email:
  address: sean.jobs@ecoworks.ca
  labels:
  - INBOX
  check_interval: 300

api:
  # Choose provider: 'anthropic' or 'openai'
  provider: anthropic

  # Anthropic API (Claude)
  anthropic_key: your-anthropic-api-key-here

  # OpenAI API (GPT-4)
  openai_key: your-openai-api-key-here

  # OpenAI settings
  openai_model: gpt-4o  # Options: gpt-4o, gpt-4o-mini, gpt-4-turbo
  use_batch: false  # Set to true for 50% cost savings (24hr processing time)

templates:
  resume: templates/resume.txt
  cover_letter: templates/cover_letter_template.txt

output:
  directory: output
  format: pdf

logging:
  level: INFO
  file: logs/job_automation.log
